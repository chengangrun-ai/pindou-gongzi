<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · 豆莉塔 DOLITA</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--paper:#F4F5F0;--ink:#16211B;--ink2:#4A564E;--accent:#2F9E6E;--deep:#1E6B49;--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Manrope","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.beads{display:flex;gap:8px;justify-content:center;margin-bottom:32px}
.beads i{width:20px;height:20px;border-radius:50%;background:var(--accent);position:relative;animation:hop 500ms var(--ease) both}
.beads i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--paper)}
.beads i:nth-child(2){background:#F2B33D;animation-delay:60ms}
.beads i:nth-child(3){background:#E8604C;animation-delay:120ms}
.beads i:nth-child(4){background:#4C86C6;animation-delay:180ms}
@keyframes hop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:48px;line-height:48px;font-weight:600;margin-bottom:16px}
p{color:var(--ink2);margin-bottom:32px}
a.btn{display:inline-block;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;font-weight:600;transition:background-color 300ms var(--ease),transform 500ms var(--ease)}
a.btn:hover{background:var(--deep)}
a.btn:active{transform:scale(0.98)}
@media (prefers-reduced-motion:reduce){.beads i{animation:none}}
</style>
</head>
<body>
<main>
<div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<h1>这颗豆子滚丢了</h1>
<p>你要找的页面不存在，可能被拼到别的板子上去了。</p>
<a class="btn" href="index.html">回首页接着拼</a>
</main>
</body>
</html>
